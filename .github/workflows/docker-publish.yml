name: Build & Publish Docker Image

# 触发条件:
#   - push 到 main 分支(代码改动自动构建)
#   - 创建 v* 开头的 tag(发布稳定版本)
#   - 手动触发(workflow_dispatch)
on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      ref:
        description: '构建的 ref(默认当前分支)'
        required: false
        default: ''

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

# 同一分支/ tag 连续 push 时自动取消过时构建,节省 Actions 配额
concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    # 传递给链式调用的 HF 同步 job
    outputs:
      version: ${{ steps.meta.outputs.version }}
      digest: ${{ steps.build.outputs.digest }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}

      # 仅构建 linux/amd64(HF Spaces 与主流 VPS 均为 amd64),无需 QEMU 模拟
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=hf,enable={{is_default_branch}}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
          build-args: |
            BUILDKIT_INLINE_CACHE=1

      - name: Generate image digest summary
        # 注意: metadata-action 输出的 tag 中镜像名已小写化(GHCR 要求
        # 全小写),此处展示与拉取命令也必须用小写名,否则用户会拉取
        # 不存在的 ghcr.io/zhu748/AIStudio2API (大小写敏感)
        env:
          FULL_IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        run: |
          IMAGE_LC="${FULL_IMAGE,,}"
          echo "## Docker Image Published" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Image:** \`${IMAGE_LC}:latest\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Tags:**" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.meta.outputs.tags }}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Digest:** \`${{ steps.build.outputs.digest }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 一键部署" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "> ⚠️ GHCR 镜像默认为 private。本地 \`docker run\` 拉取前需到 [Package 设置](https://github.com/users/${{ github.actor }}/packages) 将可见性改为 Public(或先 \`docker login ghcr.io\`)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo '```bash' >> $GITHUB_STEP_SUMMARY
          echo "docker run -d --name aistudio2api \\" >> $GITHUB_STEP_SUMMARY
          echo "  -p 7860:7860 \\" >> $GITHUB_STEP_SUMMARY
          echo "  -e AISTUDIO_AUTH_ACCOUNTS='gzip:...' \\" >> $GITHUB_STEP_SUMMARY
          echo "  -e PROXY_API_KEY=your-key \\" >> $GITHUB_STEP_SUMMARY
          echo "  -e ADMIN_TOKEN=your-admin-token \\" >> $GITHUB_STEP_SUMMARY
          echo "  ${IMAGE_LC}:latest" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

  # HF 同步: reusable workflow 只能在 JOB 级调用(不能在 step 级 uses),
  # 否则 GitHub 直接拒绝整个 workflow 文件——run 零 job 秒失败,
  # 无日志无报错,极难排查(历史踩坑)
  # (原先用 benc-uk/workflow-dispatch 触发 workflow_dispatch,需要
  #  actions:write 权限,GITHUB_TOKEN 默认没有,必 403;job 级
  #  reusable workflow 调用无此问题,secrets: inherit 可传递 HF_TOKEN)
  sync-hf:
    name: Sync to HuggingFace Space
    needs: build
    if: github.ref == 'refs/heads/main' || github.ref_type == 'tag'
    uses: ./.github/workflows/huggingface-sync.yml
    with:
      image_tag: ${{ needs.build.outputs.version }}
      digest: ${{ needs.build.outputs.digest }}
    secrets: inherit
