name: CI

# 代码质量检查: Go 编译/vet + 前端类型检查
# 在 PR 与 push 时先于 Docker 构建发现问题,反馈更快
#
# 触发:
#   - push 到 main(与 docker-publish 并行,失败时 PR 徽标可见)
#   - pull_request
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Go & Frontend Checks
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # workflow 结构校验:拦截"YAML 语法合法但 GitHub schema 非法"的
      # 错误(如 step 级 uses 调用 reusable workflow、非法键、引用不存在的
      # step output 等)。此类错误 GitHub 直接拒绝整个 workflow 文件,
      # run 零 job 秒失败且无日志,本地 YAML 校验完全发现不了。
      # shellcheck 集成关闭:历史 run 脚本存在风格告警,不在本门禁范围
      - name: Workflow lint (actionlint)
        run: |
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
          ./actionlint -color -shellcheck=

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      # go:embed 要求 internal/webui/dist 存在,PR 环境无构建产物时放置占位文件
      # (Docker 构建中由 frontend stage 生成真实产物)
      - name: Placeholder web UI dist for go:embed
        run: |
          mkdir -p internal/webui/dist
          echo '<!DOCTYPE html><html><body>placeholder</body></html>' > internal/webui/dist/index.html

      - name: Go module download
        run: go mod download

      - name: Go vet
        run: go vet ./...

      - name: Go build
        run: go build ./...

      - name: Go test
        run: go test ./... -count=1

      - name: Frontend install
        working-directory: web
        run: npm ci

      - name: Frontend typecheck
        working-directory: web
        run: npm run typecheck

      - name: Summary
        if: always()
        run: |
          echo "## CI Checks" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- go vet: done" >> $GITHUB_STEP_SUMMARY
          echo "- go build: done" >> $GITHUB_STEP_SUMMARY
          echo "- vue-tsc typecheck: done" >> $GITHUB_STEP_SUMMARY
